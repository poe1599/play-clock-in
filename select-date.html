 * @Description: 打卡日期選擇頁
 * 畫面顯示一個日期選擇區塊與 JSON 輸出操作區塊。
 * - 日期選擇區塊：
 *   - 預設顯示本月的日曆，點擊可以選擇日期，再點擊一次可以取消選擇，已選的日期會高亮顯示。
 *   - 提供一個按鈕可以切換當月/上個月的日曆顯示。
 * - JSON 輸出操作區塊：
 *   - 提供一個按鈕將已選的日期以 JSON 格式下載到本地。
 *   - 輸出檔名固定為 `selected-dates.json`，內容為已選日期的陣列。
-->
<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>打卡日期選擇</title>
    <link href="css/bootstrap.min.css" rel="stylesheet" />
    <style>
      .calendar-table {
        width: 100%;
        table-layout: fixed;
      }
      .calendar-table th,
      .calendar-table td {
        width: 14.28%; /* 100% / 7 = 14.28% */
        padding: 0;
        border: 1px solid #dee2e6;
      }
      .calendar-day {
        cursor: pointer;
        transition: all 0.2s ease;
        height: 50px;
        width: 100%;
        border: none;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 500;
      }
      .calendar-day:hover {
        background-color: #e9ecef;
      }
      .calendar-day.selected {
        background-color: #0d6efd;
        color: white;
      }
      .calendar-day.other-month {
        color: #6c757d;
        background-color: #f8f9fa;
      }
      .calendar-header {
        background-color: #f8f9fa;
      }
      .calendar-header th {
        height: 40px;
        font-weight: 600;
        color: #495057;
      }
      .json-output {
        background-color: #f8f9fa;
        border: 1px solid #dee2e6;
        border-radius: 0.375rem;
        padding: 1rem;
        max-height: 300px;
        overflow-y: auto;
      }
    </style>
  </head>
  <body>
    <div class="container-fluid py-4">
      <div class="row justify-content-center">
        <div class="col-lg-10">
          <!-- 頁面標題 -->
          <div class="row mb-4">
            <div class="col-12">
              <h2 class="text-center mb-0">打卡日期選擇</h2>
            </div>
          </div>

          <div class="row">
            <!-- 日期選擇區塊 -->
            <div class="col-lg-8 mb-4">
              <div class="card">
                <div class="card-header">
                  <div class="row align-items-center">
                    <div class="col">
                      <h5 class="card-title mb-0">日曆選擇</h5>
                    </div>
                    <div class="col-auto">
                      <div class="btn-group" role="group">
                        <button
                          type="button"
                          class="btn btn-outline-primary btn-sm"
                          id="prevMonthBtn"
                        >
                          <i class="bi bi-chevron-left"></i> 上個月
                        </button>
                        <button
                          type="button"
                          class="btn btn-outline-primary btn-sm"
                          id="currentMonthBtn"
                        >
                          本月
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
                <div class="card-body p-0">
                  <!-- 月份年份顯示 -->
                  <div class="text-center py-3 border-bottom">
                    <h4 class="mb-0" id="currentMonthYear"></h4>
                  </div>

                  <!-- 日曆表格 -->
                  <div class="table-responsive">
                    <table class="table table-bordered mb-0 calendar-table">
                      <thead class="calendar-header">
                        <tr>
                          <th class="text-center">日</th>
                          <th class="text-center">一</th>
                          <th class="text-center">二</th>
                          <th class="text-center">三</th>
                          <th class="text-center">四</th>
                          <th class="text-center">五</th>
                          <th class="text-center">六</th>
                        </tr>
                      </thead>
                      <tbody id="calendarBody">
                        <!-- 日曆內容將由 JavaScript 動態生成 -->
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            </div>

            <!-- JSON 輸出操作區塊 -->
            <div class="col-lg-4">
              <div class="card">
                <div class="card-header">
                  <h5 class="card-title mb-0">已選日期</h5>
                </div>
                <div class="card-body">
                  <!-- 已選日期清單 -->
                  <div class="mb-3">
                    <label class="form-label">選擇的日期：</label>
                    <div class="json-output" id="selectedDatesList">
                      <em class="text-muted">尚未選擇任何日期</em>
                    </div>
                  </div>

                  <!-- 操作按鈕 -->
                  <div class="d-grid gap-2">
                    <button type="button" class="btn btn-success" id="exportJsonBtn" disabled>
                      <i class="bi bi-download"></i> 匯出 JSON 檔案
                    </button>
                    <button type="button" class="btn btn-warning" id="clearSelectionBtn" disabled>
                      <i class="bi bi-trash"></i> 清空選擇
                    </button>
                  </div>

                  <!-- JSON 預覽 -->
                  <div class="mt-4">
                    <label class="form-label">JSON 預覽：</label>
                    <pre class="json-output" id="jsonPreview"><code>{
  "selectedDates": []
}</code></pre>
                  </div>
                </div>
              </div>

              <!-- 使用說明 -->
              <div class="card mt-3">
                <div class="card-header">
                  <h6 class="card-title mb-0">使用說明</h6>
                </div>
                <div class="card-body">
                  <ul class="list-unstyled mb-0 small">
                    <li class="mb-2">• 點擊日期可以選擇，再次點擊可以取消</li>
                    <li class="mb-2">• 使用「上個月」和「本月」按鈕切換月份</li>
                    <li class="mb-2">• 選擇完成後點擊「匯出 JSON 檔案」儲存</li>
                    <li class="mb-0">• 檔案名稱：selected-dates.json</li>
                  </ul>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap Icons (可選) -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <!-- Bootstrap JS -->
    <script src="js/bootstrap.bundle.min.js"></script>

    <!-- 日曆功能 JavaScript -->
    <script>
      class CalendarSelector {
        constructor() {
          this.currentDate = new Date()
          this.selectedDates = new Set()
          this.init()
        }

        init() {
          this.bindEvents()
          this.renderCalendar()
          this.updateDisplay()
        }

        bindEvents() {
          document.getElementById('prevMonthBtn').addEventListener('click', () => {
            this.currentDate.setMonth(this.currentDate.getMonth() - 1)
            this.renderCalendar()
          })

          document.getElementById('currentMonthBtn').addEventListener('click', () => {
            this.currentDate = new Date()
            this.renderCalendar()
          })

          document.getElementById('exportJsonBtn').addEventListener('click', () => {
            this.exportJson()
          })

          document.getElementById('clearSelectionBtn').addEventListener('click', () => {
            this.clearSelection()
          })
        }

        renderCalendar() {
          const year = this.currentDate.getFullYear()
          const month = this.currentDate.getMonth()

          // 更新月份年份顯示
          document.getElementById('currentMonthYear').textContent = `${year}年 ${month + 1}月`

          // 計算日曆起始日期
          const firstDayOfMonth = new Date(year, month, 1)
          const dayOfWeek = firstDayOfMonth.getDay()

          // 計算該月第一週的星期日
          const startDate = new Date(year, month, 1 - dayOfWeek)

          const calendarBody = document.getElementById('calendarBody')
          calendarBody.innerHTML = ''

          // 生成6週的日曆（6行 x 7列 = 42天）
          for (let week = 0; week < 6; week++) {
            const weekRow = document.createElement('tr')

            for (let day = 0; day < 7; day++) {
              // 計算當前日期
              const dayOffset = week * 7 + day
              const currentDay = new Date(
                startDate.getFullYear(),
                startDate.getMonth(),
                startDate.getDate() + dayOffset,
              )

              const cell = document.createElement('td')
              const dayDiv = document.createElement('div')
              dayDiv.className = 'calendar-day'
              dayDiv.textContent = currentDay.getDate()

              const dateStr = this.formatDate(currentDay)
              const isCurrentMonth = currentDay.getMonth() === month
              const isSelected = this.selectedDates.has(dateStr)

              // 設定樣式
              if (!isCurrentMonth) {
                dayDiv.classList.add('other-month')
              }

              if (isSelected) {
                dayDiv.classList.add('selected')
              }

              // 添加點擊事件（只有當月日期可以選擇）
              dayDiv.addEventListener('click', () => {
                if (isCurrentMonth) {
                  this.toggleDate(dateStr)
                  this.renderCalendar()
                  this.updateDisplay()
                }
              })

              cell.appendChild(dayDiv)
              weekRow.appendChild(cell)
            }

            calendarBody.appendChild(weekRow)
          }
        }

        toggleDate(dateStr) {
          if (this.selectedDates.has(dateStr)) {
            this.selectedDates.delete(dateStr)
          } else {
            this.selectedDates.add(dateStr)
          }
        }

        formatDate(date) {
          return date.toISOString().split('T')[0]
        }

        updateDisplay() {
          const selectedArray = Array.from(this.selectedDates).sort()

          // 更新已選日期列表
          const listContainer = document.getElementById('selectedDatesList')
          if (selectedArray.length === 0) {
            listContainer.innerHTML = '<em class="text-muted">尚未選擇任何日期</em>'
          } else {
            listContainer.innerHTML = selectedArray
              .map((date) => `<span class="badge bg-primary me-1 mb-1">${date}</span>`)
              .join('')
          }

          // 更新 JSON 預覽
          const jsonData = {
            selectedDates: selectedArray,
            totalCount: selectedArray.length,
            exportTime: new Date().toISOString(),
          }
          document.getElementById('jsonPreview').innerHTML =
            '<code>' + JSON.stringify(jsonData, null, 2) + '</code>'

          // 更新按鈕狀態
          const hasSelection = selectedArray.length > 0
          document.getElementById('exportJsonBtn').disabled = !hasSelection
          document.getElementById('clearSelectionBtn').disabled = !hasSelection
        }

        exportJson() {
          const selectedArray = Array.from(this.selectedDates).sort()
          const filename = 'selected-dates.json'

          const jsonData = {
            selectedDates: selectedArray,
            totalCount: selectedArray.length,
            exportTime: new Date().toISOString(),
          }

          const blob = new Blob([JSON.stringify(jsonData, null, 2)], {
            type: 'application/json',
          })

          const url = URL.createObjectURL(blob)
          const a = document.createElement('a')
          a.href = url
          a.download = filename
          document.body.appendChild(a)
          a.click()
          document.body.removeChild(a)
          URL.revokeObjectURL(url)

          // 顯示成功訊息
          const toast = document.createElement('div')
          toast.className = 'toast-container position-fixed bottom-0 end-0 p-3'
          toast.innerHTML = `
            <div class="toast show" role="alert">
              <div class="toast-header">
                <strong class="me-auto">匯出成功</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
              </div>
              <div class="toast-body">
                已成功匯出 ${filename}
              </div>
            </div>
          `
          document.body.appendChild(toast)

          setTimeout(() => {
            document.body.removeChild(toast)
          }, 3000)
        }

        clearSelection() {
          this.selectedDates.clear()
          this.renderCalendar()
          this.updateDisplay()
        }
      }

      // 初始化日曆
      document.addEventListener('DOMContentLoaded', () => {
        new CalendarSelector()
      })
    </script>
  </body>
</html>
